<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>KTtenmienIP-Pro</title>
<style>
  :root{
    --bg:#0f1115; --panel:#1c1f26; --card:#161a20;
    --border:#2a2f38; --text:#e5e5e5;
    --accent:#39e58c; --blue:#4f8cff; --red:#ff3b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{padding:14px;background:var(--bg);color:var(--text);
       font-family:Segoe UI,Tahoma,sans-serif}
  .header{display:flex;justify-content:space-between;align-items:center;
          margin-bottom:10px;gap:12px;flex-wrap:wrap}
  .left{display:flex;align-items:center;gap:12px}
  .logo{font-size:22px;color:var(--red);font-weight:700}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button,.batch button{
    background:var(--panel);color:#ccc;border:1px solid #333;font-size:18pt;
    padding:6px 14px;border-radius:6px;cursor:pointer}
  .tabs button.active{background:var(--accent);color:#000;font-weight:700}
  .stats{font-size:20pt;color:#6fa8ff}
  .batch{display:grid;grid-template-columns:repeat(30,1fr);
         gap:6px;margin-bottom:10px}
  .batch button{padding:6px;border-radius:5px}
  .batch button.active{background:var(--blue);color:#000;font-weight:700}
  .batch button.nav{background:#2a2f38;color:#fff;font-weight:700}
  .batch button.nav:hover{background:#3a404c}
  .batch button:disabled{opacity:.3;cursor:not-allowed}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .card{background:var(--card);border:1px solid var(--border);
        border-radius:6px;overflow:hidden}
  .card-header{display:flex;justify-content:space-between;align-items:center;
               padding:4px 6px;font-size:11px;background:#1f2430}
  .card-header a{color:#7aa2ff;text-decoration:none;max-width:75%;
                 overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  /* Nút OPEN mới nằm ở header */
  .btn-open-header{
    font-size:12px;padding:2px 8px;border:none;border-radius:3px;
    background:#1e8e3e;color:#fff;cursor:pointer;font-weight:bold;
  }
  .btn-open-header:hover{background:#2aa84d}
  
  .iframe-box{height:220px;overflow:hidden;background:#0b0d11}
  .iframe-inner{transform:scale(.38);transform-origin:top left;
                width:260%;height:260%}
  .iframe-inner iframe{width:100%;height:100%;border:none;background:#0b0d11}
  .card-wrap{position:relative}
  .tools{position:absolute;bottom:6px;right:6px;display:flex;gap:4px}
  .tools button{font-size:15px;padding:1px 5px;border:none;
                border-radius:4px;background:var(--border);
                color:#ccc;cursor:pointer}
  .tools button:hover{background:#3a404c}
  /* Nút LOAD giờ nằm ở tools */
  .tools .btn-load{background:#1e8e3e;color:#fff}
  .tools .btn-load:hover{background:#2aa84d}
</style>
</head>

/* ===== GOM NHÓM ===== */
const TABS = [
  { label: '王中王',  data: GROUP_1 },
  { label: '满堂红',  data: GROUP_2 },
  { label: '曾道人',  data: GROUP_3 },
  { label: '大赢家',  data: GROUP_4 },
  { label: '聚彩堂',  data: GROUP_5 },
  { label: '金钥匙',  data: GROUP_6 },
  { label: '红姐论坛',  data: GROUP_7 },
  { label: '铁算盘',  data: GROUP_8 },
  { label: '大三巴',  data: GROUP_9 }
];

/* ===== STATE ===== */
const BATCH_SIZE = 20;
let currentTab = 0;
let currentBatch = 0;

/* ===== HELPERS ===== */
const $ = id => document.getElementById(id);
const normalize = url => /^https?:\/\//i.test(url) ? url : 'https://' + url;

/* ===== RENDER TABS ===== */
function renderTabs(){
  const box = $('tabs');
  box.innerHTML = '';
  TABS.forEach((tab, i) => {
    const btn = document.createElement('button');
    btn.textContent = tab.label;
    btn.classList.toggle('active', i === currentTab);
    btn.onclick = () => switchTab(i);
    box.appendChild(btn);
  });
}

/* ===== CHUYỂN BATCH (dùng cho cả số, ◀, ▶) ===== */
function goBatch(i){
  const links = TABS[currentTab].data;
  const pages = Math.ceil(links.length / BATCH_SIZE);
  if (i < 0 || i >= pages) return;
  currentBatch = i;
  render();
  loadAllCurrent();
}

/* ===== RENDER BATCH BAR ===== */
function renderBatchBar(total){
  const bar = $('batchBar');
  bar.innerHTML = '';
  const pages = Math.ceil(total / BATCH_SIZE);

  const prev = document.createElement('button');
  prev.textContent = '◀';
  prev.className = 'nav';
  prev.disabled = currentBatch === 0;
  prev.onclick = () => goBatch(currentBatch - 1);
  bar.appendChild(prev);

  for (let i = 0; i < pages; i++){
    const btn = document.createElement('button');
    btn.textContent = i + 1;
    btn.classList.toggle('active', i === currentBatch);
    btn.onclick = () => goBatch(i);
    bar.appendChild(btn);
  }

  const next = document.createElement('button');
  next.textContent = '▶';
  next.className = 'nav';
  next.disabled = currentBatch === pages - 1;
  next.onclick = () => goBatch(currentBatch + 1);
  bar.appendChild(next);
}

/* ===== LOAD TOÀN BỘ IFRAME TRONG BATCH HIỆN TẠI ===== */
function loadAllCurrent(){
  document.querySelectorAll('iframe[data-src]').forEach(f => {
    f.src = f.dataset.src;
  });
}

/* ===== TẠO CARD (OPEN MỞ TAB MỚI - CỐ GẮNG GIỮ FOCUS) ===== */
function createCard(link){
  const safe = normalize(link);
  const card = document.createElement('div');
  card.className = 'card';
  
  card.innerHTML = `
    <div class="card-header">
      <a href="${safe}" target="_blank" rel="noopener">${safe}</a>
      <button class="btn-open-header">OPEN</button>
    </div>
    <div class="card-wrap">
      <div class="iframe-box">
        <div class="iframe-inner">
          <iframe data-src="${safe}" loading="lazy"></iframe>
        </div>
      </div>
      <div class="tools">
        <button class="btn-load">LOAD</button>
      </div>
    </div>
  `;

  const iframe = card.querySelector('iframe');
  
  // Nút LOAD: tải iframe
  card.querySelector('.btn-load').onclick = () => {
    iframe.src = iframe.dataset.src;
  };

  // Nút OPEN: mở tab mới và cố gắng giữ focus ở tab hiện tại
  card.querySelector('.btn-open-header').onclick = () => {
    const newWindow = window.open(safe, '_blank', 'noopener,noreferrer');
    if (newWindow) {
      newWindow.blur();  // Làm mờ cửa sổ mới
      window.focus();    // Focus lại cửa sổ hiện tại
    }
  };

  return card;
}

/* ===== RENDER CHÍNH ===== */
function render(){
  const links = TABS[currentTab].data;

  $('statBatch').textContent = currentBatch + 1;
  $('statTotal').textContent = links.length;

  renderTabs();
  renderBatchBar(links.length);

  const grid = $('grid');
  grid.innerHTML = '';
  const start = currentBatch * BATCH_SIZE;
  links.slice(start, start + BATCH_SIZE).forEach(link => {
    grid.appendChild(createCard(link));
  });
}

/* ===== SWITCH TAB ===== */
function switchTab(i){
  currentTab = i;
  currentBatch = 0;
  render();
}

/* ===== INIT ===== */
render();
